<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>@files-preview-app/preview-file — Live Interactive Demo</title>
  <meta name="description" content="Universal client-side file preview for PDF, Word, Excel, PowerPoint, and 50+ formats. React, Angular, Vue, and Vanilla JS. 100% free, MIT licensed." />
  <script>
    window.__consoleLogs = [];
    const origLog = console.log, origWarn = console.warn, origErr = console.error;
    console.log = function(...args) { window.__consoleLogs.push({ t: 'log', m: args.join(' ') }); origLog.apply(console, args); };
    console.warn = function(...args) { window.__consoleLogs.push({ t: 'warn', m: args.join(' ') }); origWarn.apply(console, args); };
    console.error = function(...args) { window.__consoleLogs.push({ t: 'error', m: args.join(' ') }); origErr.apply(console, args); };
    window.addEventListener('error', function(e) { window.__consoleLogs.push({ t: 'window.error', m: e.message + ' at ' + e.filename + ':' + e.lineno }); });
    window.addEventListener('unhandledrejection', function(e) { window.__consoleLogs.push({ t: 'unhandledrejection', m: (e.reason && e.reason.message) || String(e.reason) }); });
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="theme-light">
  <div class="app-layout">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">👁️</span>
        <span class="brand-title">preview-file</span>
        <span class="badge">v1.3.1</span>
      </div>
      <div class="header-actions">
        <a href="https://www.npmjs.com/package/@files-preview-app/preview-file" target="_blank" class="nav-btn npm-btn">
          <span>npm i @files-preview-app/preview-file</span>
        </a>
        <a href="https://github.com/patelsumit5192/preview-file" target="_blank" class="nav-btn">
          GitHub
        </a>
        <button id="theme-toggle" class="theme-btn" title="Toggle Light/Dark Theme">
          🌙
        </button>
      </div>
    </header>

    <div class="app-main">
      <aside class="sidebar">
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" class="file-input-hidden" />
          <div class="drop-content">
            <span class="drop-icon">📁</span>
            <span class="drop-text">Drag & drop any file here</span>
            <span class="drop-subtext">or click to browse your computer</span>
          </div>
        </div>


        <div class="section-title">TEST WITH INSTANT SAMPLES</div>
        <div class="sample-grid">
          <button class="sample-btn" data-sample="pdf">
            <span class="sample-icon">📄</span>
            <span class="sample-label">PDF Document</span>
          </button>
          <button class="sample-btn" data-sample="docx">
            <span class="sample-icon">📝</span>
            <span class="sample-label">Word (.docx)</span>
          </button>
          <button class="sample-btn" data-sample="docm">
            <span class="sample-icon">📝</span>
            <span class="sample-label">Macro Word (.docm)</span>
          </button>
          <button class="sample-btn" data-sample="doc">
            <span class="sample-icon">📄</span>
            <span class="sample-label">Legacy Word (.doc)</span>
          </button>
          <button class="sample-btn" data-sample="dot">
            <span class="sample-icon">📄</span>
            <span class="sample-label">Word Template (.dot)</span>
          </button>
          <button class="sample-btn" data-sample="dotx">
            <span class="sample-icon">📝</span>
            <span class="sample-label">Word Template (.dotx)</span>
          </button>
          <button class="sample-btn" data-sample="dotm">
            <span class="sample-icon">📝</span>
            <span class="sample-label">Macro Template (.dotm)</span>
          </button>
          <button class="sample-btn" data-sample="txt">
            <span class="sample-icon">📄</span>
            <span class="sample-label">Plain Text (.txt)</span>
          </button>
          <button class="sample-btn" data-sample="xlsx">
            <span class="sample-icon">📊</span>
            <span class="sample-label">Excel (.xlsx)</span>
          </button>
          <button class="sample-btn" data-sample="xls">
            <span class="sample-icon">📈</span>
            <span class="sample-label">Legacy Excel (.xls)</span>
          </button>
          <button class="sample-btn" data-sample="pptx">
            <span class="sample-icon">📽️</span>
            <span class="sample-label">PowerPoint (.pptx)</span>
          </button>
          <button class="sample-btn" data-sample="ppt">
            <span class="sample-icon">📽️</span>
            <span class="sample-label">Legacy PPT (.ppt)</span>
          </button>
          <button class="sample-btn" data-sample="csv">
            <span class="sample-icon">📈</span>
            <span class="sample-label">CSV Table</span>
          </button>
          <button class="sample-btn" data-sample="zip">
            <span class="sample-icon">📦</span>
            <span class="sample-label">ZIP Archive</span>
          </button>
          <button class="sample-btn" data-sample="markdown">
            <span class="sample-icon">📑</span>
            <span class="sample-label">Rich Markdown</span>
          </button>
          <button class="sample-btn" data-sample="3d">
            <span class="sample-icon">🧊</span>
            <span class="sample-label">3D Model (STL)</span>
          </button>
          <button class="sample-btn" data-sample="code">
            <span class="sample-icon">💻</span>
            <span class="sample-label">Code (TypeScript)</span>
          </button>
          <button class="sample-btn" data-sample="svg">
            <span class="sample-icon">🖼️</span>
            <span class="sample-label">Vector (SVG)</span>
          </button>
          <button class="sample-btn" data-sample="rtf">
            <span class="sample-icon">📝</span>
            <span class="sample-label">Rich Text (.rtf)</span>
          </button>
          <button class="sample-btn" data-sample="odt">
            <span class="sample-icon">📄</span>
            <span class="sample-label">OpenDoc (.odt)</span>
          </button>
          <button class="sample-btn" data-sample="ods">
            <span class="sample-icon">📑</span>
            <span class="sample-label">OpenSheet (.ods)</span>
          </button>
          <button class="sample-btn" data-sample="html">
            <span class="sample-icon">🌐</span>
            <span class="sample-label">Webpage (.html)</span>
          </button>
          <button class="sample-btn" data-sample="photo">
            <span class="sample-icon">📷</span>
            <span class="sample-label">Photo (JPEG)</span>
          </button>
          <button class="sample-btn" data-sample="audio">
            <span class="sample-icon">🎵</span>
            <span class="sample-label">Audio (MP3)</span>
          </button>
          <button class="sample-btn" data-sample="video">
            <span class="sample-icon">🎬</span>
            <span class="sample-label">Video (MP4)</span>
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="compliance-badge">
            <span class="check-icon">✓</span> 100% Client-Side · Permissive MIT License
          </div>
        </div>
      </aside>

      <main class="content-area">
        <div class="preview-card">
          <div class="preview-header">
            <div class="active-file-info">
              <span id="file-name" class="active-file-name">sample.pdf</span>
              <span id="file-meta" class="active-file-meta">Loading preview...</span>
            </div>
            <div class="preview-header-actions">
              <button id="toggle-filename-btn" class="header-action-btn" title="Toggle File Name Property (showFileName)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                <span id="filename-btn-text">File Name: ON</span>
              </button>
              <button id="header-thumbnails-btn" class="header-action-btn" title="Toggle Page Thumbnails">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Thumbnails</span>
              </button>
              <button id="open-window-btn" class="header-action-btn" title="Open in Separate Full Window">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="8" x2="21" y2="8"></line><circle cx="6" cy="5.5" r="0.75" fill="currentColor"></circle><circle cx="8.5" cy="5.5" r="0.75" fill="currentColor"></circle><polyline points="14 13 18 13 18 17"></polyline><line x1="11" y1="20" x2="18" y2="13"></line></svg>
                <span>Open in Separate Full Window</span>
              </button>
            </div>
          </div>
          <div id="preview-viewport" class="preview-viewport"></div>
        </div>

        <div class="snippet-card">
          <div class="snippet-header">
            <span class="snippet-title">HOW TO USE IN YOUR PROJECT</span>
            <div class="snippet-tabs">
              <button class="tab-btn active" data-tab="react">React</button>
              <button class="tab-btn" data-tab="angular">Angular</button>
              <button class="tab-btn" data-tab="vue">Vue 3</button>
              <button class="tab-btn" data-tab="vanilla">Vanilla JS</button>
            </div>
          </div>
          <div class="snippet-body">
            <pre><code id="snippet-code"></code></pre>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
